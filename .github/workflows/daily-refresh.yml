name: Daily refresh

# Runs overnight, not at the close. Massive's free tier only serves a trading
# day after that day has ended (asking at 7:41 pm ET returned 403 "before end
# of day"), and the ETL fetches up to yesterday by the runner's UTC date.
# 07:00 UTC is 2 am EST / 3 am EDT, so Tuesday to Saturday picks up Monday to
# Friday. The 13:00 UTC run retries if Massive published late; when there's
# nothing new it finishes in seconds.
on:
  schedule:
    - cron: "0 7 * * 2-6"
    - cron: "0 13 * * 2-6"

permissions:
  contents: read

# Never overlap two writers, and never cancel a run part way through.
concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync python -m app.etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
