# Render Blueprint: one web service for the API and the built frontend.
# DATABASE_URL and ANTHROPIC_API_KEY are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: market-rs
    runtime: docker
    plan: free
    region: ohio # next to the Supabase database in us-east-2
    branch: main
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      # Powers ChatWithAI in the AI Researcher panel; without it chat shows as unavailable
      - key: ANTHROPIC_API_KEY
        sync: false
